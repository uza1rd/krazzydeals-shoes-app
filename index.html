<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KrazzydealS - Premium Fashion & Lifestyle</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <!-- Top Nav / Header -->
    <header class="header" id="header">
        <div class="header-container">
            <div class="logo">
                <a href="#">
                    <!-- SVG Logo for KrazzydealS -->
                    <svg width="150" height="40" viewBox="0 0 150 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <text class="logo-text" x="0" y="28" font-family="Inter" font-weight="700" font-size="24">Krazzy<tspan class="logo-highlight">dealS</tspan></text>
                    </svg>
                </a>
            </div>

            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search premium items...">
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>

            <div class="header-actions">
                <button class="icon-btn theme-toggle" id="themeToggle" aria-label="Toggle Dark Mode">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="mobile-menu-btn" id="mobileMenuBtn">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </div>

        <!-- Categories Nav -->
        <nav class="category-nav">
            <ul id="categoryList">
                <!-- Dynamically populated from JS -->
                <li><button class="category-btn active" data-category="All">All</button></li>
            </ul>
        </nav>
    </header>

    <!-- Mobile Search (Visible only on mobile) -->
    <div class="mobile-search">
        <div class="search-bar">
            <input type="text" id="mobileSearchInput" placeholder="Search products...">
            <button id="mobileSearchBtn"><i class="fas fa-search"></i></button>
        </div>
    </div>


    <!-- Main Content Grid -->
    <main class="main-container">

        <!-- Filters Area -->
        <div class="filter-controls">
            <h2>Our Products</h2>
        </div>

        <!-- Product Grid -->
        <div class="product-grid" id="productGrid">
            <!-- Skeleton Loaders -->
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
        </div>
    </main>

    <!-- Product Detail Modal -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content">
            <button class="close-modal" id="closeModalBtn"><i class="fas fa-times"></i></button>
            <div class="modal-body" id="modalBody">
                <!-- Populated dynamically -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-bottom">
            <p>&copy; 2026 KrazzydealS. All rights reserved.</p>
        </div>
    </footer>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Scripts -->
    <script src="js/products.js"></script>
    <script src="js/filters.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
